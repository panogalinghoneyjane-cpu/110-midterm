<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuietNook | Book Finder App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="logo">QuietNook</a>
      <ul class="nav-links">
        <li><a href="index.html">← Portfolio</a></li>
        <li>
          <button type="button" id="readingListBtn" class="btn btn-small">
            My Reading List (<span id="readingCount">0</span>)
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container app">

    <section class="search-panel">
      <h1>Find a Book</h1>
      <p class="muted">Search millions of books from the Open Library database.</p>

      <form id="searchForm" class="search-form" novalidate>
        <label for="searchType" class="sr-only">Search by</label>
        <select id="searchType">
          <option value="q">Keyword</option>
          <option value="title">Title</option>
          <option value="author">Author</option>
          <option value="subject">Subject</option>
        </select>

        <label for="searchInput" class="sr-only">Search term</label>
        <input type="text" id="searchInput" placeholder="e.g. Clean Code, Rizal, data science" autocomplete="off">

        <button type="submit" class="btn" id="searchBtn">Search</button>
      </form>

      <div id="recentSearches" class="recent"></div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="results" class="results-grid"></section>

    <div id="pagination" class="pagination" hidden>
      <button type="button" id="prevBtn" class="btn btn-outline">← Previous</button>
      <span id="pageInfo"></span>
      <button type="button" id="nextBtn" class="btn btn-outline">Next →</button>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Data from the <a href="https://openlibrary.org/developers/api" target="_blank" rel="noopener">Open Library API</a> · Team ShelfSearch</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
